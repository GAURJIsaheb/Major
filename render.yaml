services:
  - type: web
    name: major-backend
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: backend
      - key: CORS_ORIGIN
        value: https://YOUR-FRONTEND.onrender.com
      - key: PORT
        value: 10000
      # Add the remaining required env vars in Render Dashboard:
      # ACCESS_TOKEN_SECRET, REFRESH_TOKEN, MONGO_DB_URL, DB_NAME, REDIS_URL, etc.

  - type: static
    name: major-frontend
    rootDir: client
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://YOUR-BACKEND.onrender.com
      - key: VITE_WS_BASE_URL
        value: wss://YOUR-BACKEND.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
